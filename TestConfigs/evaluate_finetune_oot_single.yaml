logging:
  level: INFO
  path: ./outputs/logs
mode: single_task
paths:
  model: "./outputs/oot_single/model"
  folds_dir: "./outputs/oot_single/prepared_data"
  test_data_dir: "./outputs/oot_single/held_out/prepared_data"
  predictions: "./outputs/oot_single/predictions"
test_batch_size: 8
return_embeddings: false
metrics:
  roc_auc:
    _target_: sklearn.metrics.roc_auc_score
  pr_auc:
    _target_: sklearn.metrics.average_precision_score
explainability:
  enabled: true
  methods:
    gru_attention: false
    shap: true
  shap:
    explain_all_positives: false
    explain_positive_samples: 2
    explain_negative_samples: 2
