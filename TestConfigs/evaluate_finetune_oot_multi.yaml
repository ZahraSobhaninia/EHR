logging:
  level: INFO
  path: ./outputs/logs

mode: multi_task
tasks:
  - Mortality
  - ARF

paths:
  model: "./outputs/oot_multi/model"
  folds_dir: "./outputs/oot_multi/prepared_data"
  test_data_dir: "./outputs/oot_multi/held_out/prepared_data"
  predictions: "./outputs/oot_multi/predictions"

test_batch_size: 8
return_embeddings: false

metrics:
  roc_auc:
    _target_: sklearn.metrics.roc_auc_score
  pr_auc:
    _target_: sklearn.metrics.average_precision_score

explainability:
  enabled: true
  methods:
    gru_attention: false
    shap: true
  shap:
    explain_all_positives: false
    explain_positive_samples: 2
    explain_negative_samples: 2
