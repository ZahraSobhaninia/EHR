logging:
  level: INFO
  path: ./outputs/logs

mode: multi_task
tasks:
  - Mortality
  - ARF

paths:
  model: "./outputs/cv_multi/model"
  folds_dir: "./outputs/cv_multi/prepared_data"
  test_data_dir: "./outputs/cv_multi/held_out/prepared_data"
  predictions: "./outputs/cv_multi/predictions"

test_batch_size: 8
return_embeddings: false

metrics:
  roc_auc:
    _target_: sklearn.metrics.roc_auc_score
  pr_auc:
    _target_: sklearn.metrics.average_precision_score
