logging:
  level: INFO
  path: ./outputs/logs

mode: single_task

paths:
  features: "./outputs/run1/features"
  initial_pids: "./outputs/run1/tokenized/pids_held_out.pt"
  outcome: "./example_data/outcomes/held_out/outcome.csv"
  exposure: "./example_data/outcomes/held_out/exposure.csv"
  cohort: "./outputs/run1/cv_single/held_out/cohort"

selection:
  exclude_prior_outcomes: true
  exposed_only: true
  age:
    min_years: 0
    max_years: 120

index_date:
  mode: relative
  relative:
    n_hours_from_exposure: 0

cv_folds: 1
test_ratio: 1
