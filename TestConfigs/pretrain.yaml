logging:
  level: INFO
  path: ./outputs/logs

paths:
  prepared_data: "./outputs/run1/pretrain/prepared_data"
  model: "./outputs/run1/pretrain/model"

data:
  dataset:
    select_ratio: 0.2
    masking_ratio: 0.8
    replace_ratio: 0.1
    ignore_special_tokens: true
  val_ratio: 0.1

trainer_args:
  save_representations: false
  save_labels: false
  representation_types: ["mean"]
  task: pretrain
  batch_size: 16
  effective_batch_size: 16
  epochs: 2
  info: false
  shuffle: true
  early_stopping: false

model:
  hidden_size: 64
  num_hidden_layers: 2
  num_attention_heads: 4
  intermediate_size: 128
  type_vocab_size: 256
  embedding_dropout: 0.1
  max_position_embeddings: 512
  is_causal: false

optimizer:
  lr: 5e-4
  eps: 1e-6

metrics:
  top1:
    _target_: corebehrt.modules.monitoring.metrics.PrecisionAtK
    topk: 1
  top10:
    _target_: corebehrt.modules.monitoring.metrics.PrecisionAtK
    topk: 10