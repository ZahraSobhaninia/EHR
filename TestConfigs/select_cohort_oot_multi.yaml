logging:
  level: INFO
  path: ./outputs/logs

mode: multi_task

paths:
  features: "./outputs/test/features"
  initial_pids: "./outputs/test/tokenized/pids_train.pt"
  outcomes: "./example_data/outcomes/multi"
  outcome_names:
    - Mortality
    - ARF
  exposure: "exposure.csv"
  outcome: "outcome.csv"
  cohort: "./outputs/test/oot_multi/cohort"

selection:
  exclude_prior_outcomes: true
  exposed_only: true
  age:
    min_years: 0
    max_years: 120

index_date:
  mode: relative
  relative:
    n_hours_from_exposure: 0

cv_folds: 1
test_ratio: 0.2
