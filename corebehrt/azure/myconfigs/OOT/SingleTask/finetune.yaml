logging:
  level: INFO
  path: ./outputs/logs

#SSSI
#PNEUMONIA

paths:
## INPUTS
  prepared_data: "researcher_data:Zahra/062026/CoreBehrt_OOT/MDPS/2_Finetune/PNEUMONIA/Data/Finetunedata" 
  pretrain_model: "researcher_data:Zahra/052026/CoreBehrt_OOT/MDPS/1_Pretrain/Model" 
  # restart_model: ... # Use for restarting from checkpoint
      
## OUTPUTS
  model: "researcher_data:Zahra/062026/CoreBehrt_OOT/MDPS/2_Finetune/PNEUMONIA/UniversalModel_1/05"  
          
  #runs: ./outputs/pretraining # Use for generating a new modeal folder
  
evaluate: false # evaluate best model on test sets
      
model:
  cls:
    _target_: ehr2vec.model.heads.ClassifierGRU
    bidirectional: true
    

trainer_args:
  
  task: finetune
  save_representations: true
  save_labels: true
  representation_types: ["mean", "cls", "max", "last"]
 
  loss_function: null    # ‌BCE
    #_target_: corebehrt.modules.trainer.losses.FocalLoss
    #alpha: 0.98   #0.98 for mortality(86:1)  0.9744->Bleed (1:38)  0.998->ARF(526)    0.998->PRI(1:44)
    #gamma: 1   #2      
    #use_pos_weight: true

        
  sampler_function: 
    _target_: corebehrt.modules.trainer.utils.Sampling.inverse_sqrt
    #_target_: corebehrt.modules.trainer.utils.Sampling.effective_n_samples 
    #function to calculate sample weights. ----Possible options: inverse_sqrt and effective_n_samples

  loss_weight_function: 
    _target_: corebehrt.modules.trainer.utils.PositiveWeight.sqrt  
    #_target_: corebehrt.modules.trainer.utils.PositiveWeight.effective_n_samples 
    # function to calculate positive weights. Possible options: sqrt and effective_n_samples

  batch_size: 128
  val_batch_size: 256
  effective_batch_size: 512
  
  epochs: 20 
  info: true
  gradient_clip: 
    clip_value: 1     #0.5 #1     # 0.25 
  shuffle: true
  checkpoint_frequency: 1
  early_stopping: 15               
  stopping_criterion: roc_auc   #pr_auc    
  

  # Freezing options
  n_layers_to_freeze: 3    #5  #4  #3
  unfreeze_on_plateau: true  #true  # unfreeze all layers if the performance is less than plateau_threshold 
  unfreeze_at_epoch: 7    # if unfrezze_on_plateau is true, whichever condition is met first
  plateau_threshold: 0.003 
  reset_patience_after_unfreeze: true # reset early stopping counter after unfreezing
  

optimizer:
  lr: 1e-5   #2e-5
  eps: 1e-8
  weight_decay: 0.001 

scheduler:
  _target_: transformers.get_cosine_schedule_with_warmup   #transformers.get_linear_schedule_with_warmup

  num_warmup_steps: 566           #849  #566        #283  # ~5% of steps
  num_training_steps: 5660      #8490  #5660 

#mortality 
#scheduler.step() هر 4 batch = هر 512 نمونه
#steps_per_epoch = 1131 / 4 = 283
#num_training_steps = 283 × 20 = 5,660
#num_warmup_steps = 283 

    
metrics:
  accuracy:
    _target_: corebehrt.modules.monitoring.metrics.Accuracy
    threshold: 0.05
  roc_auc:
    _target_: corebehrt.modules.monitoring.metrics.ROC_AUC
  pr_auc:
    _target_: corebehrt.modules.monitoring.metrics.PR_AUC
  precentage_positives:
    _target_: corebehrt.modules.monitoring.metrics.Percentage_Positives

  mean_probability:
    _target_: corebehrt.modules.monitoring.metrics.Mean_Probability
  true_positives:
    _target_: corebehrt.modules.monitoring.metrics.True_Positives

  true_negatives:
    _target_: corebehrt.modules.monitoring.metrics.True_Negatives
  false_positives:
    _target_: corebehrt.modules.monitoring.metrics.False_Positives

  false_negatives:
    _target_: corebehrt.modules.monitoring.metrics.False_Negatives
  
  

 
