logging:
  level: INFO
  path: ./outputs/logs

paths:
## INPUTS
  features: 'researcher_data:Zahra/022026/CoreBehrt_CV/MD/0_CreateData/features'
  tokenized: 'researcher_data:Zahra/022026/CoreBehrt_CV/MD/0_CreateData/tokenized'
  cohort: "researcher_data:Zahra/022026/CoreBehrt_CV/MD/3_Heldout/Mortality/Data/SelectCohort"
  outcomes: 'researcher_data:Zahra/022026/CoreBehrt_CV/CreateOutcome/Mortality'
  outcome: 'outcome.csv'

## OUTPUTS
  prepared_data: "researcher_data:Zahra/022026/CoreBehrt_CV/MD/3_Heldout/Mortality/Data/Processed_data"  # Save model/outputs to this folder
  #runs: ./outputs/pretraining # Use for generating a new model folder
  

data:
  type: "test"
  test_modes: ["held_out"] # list with name of features where test data is stored. Only used for test_data
  truncation_len: 512
  min_len: 2 # 0 by default

outcome: # we will convert outcomes to binary based on whether at least one outcome is in the follow up window
  n_hours_censoring: 0 # censor time after index date (negative means before)
  n_hours_start_follow_up: 0 # start follow up (considering outcomes) time after index date (negative means before)
  n_hours_end_follow_up: 720 # end follow up (considering outcomes) time after index date (negative means before)
