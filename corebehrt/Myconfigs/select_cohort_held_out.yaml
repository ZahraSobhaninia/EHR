logging:
  level: INFO
  path: ./outputs/logs

paths:
  ### Inputs
  features: 'researcher_data:Zahra/022026/CoreBehrt_CV/MDP/0_CreateData/features'
  
  outcomes: 'researcher_data:Zahra/022026/CoreBehrt_CV/CreateOutcome/Bleed'
  exposure: 'exposure.csv' # Exposure, optional, set to outinitial_pids: researcher_data:Zahra/022026/CoreBehrt_CV/MDP/0_CreateData/tokenized/pids_held_out.pt  # Initial patients to select from [list of pids] (optional)come if not provided. For multiple exposures, create a joint exposure file.
  outcome: 'outcome.csv' # Outcome
  # exclude_pids: # optional, if provided, exclude these pids from the cohort
  
  ### Outputs
  cohort: "researcher_data:Zahra/022026/CoreBehrt_CV/MDP/3_Heldout/Bleed/Data/SelectCohort"   # Data directory

selection:
  exclude_prior_outcomes: true # Exclude patients who had the outcome before index date
  exposed_only: true # Exclude patients who are not exposed
  age:
    min_years: 0 # Minimum age to include (inclusive)
    max_years: 120 # Maximum age to include (inclusive)
  #categories: # here we can include OR exclude categories
  #  GENDER: # column name in the data
  #    include: [M] # include only M/ exclude keyword can be used as well.

index_date: # if not provided we can use exposures to get the index dates
  mode: relative # absolute or relative (to exposure)
#  absolute: 
#    year: 2015
#    month: 1
#    day: 26
  relative: # takes first exposure as index date
    n_hours_from_exposure: 0 # negative means before exposure, 0 by default

cv_folds: 1 # can be set to 1 if only a simple train/val split is needed
test_ratio: 1 # can be set to 1 for test set creation only
