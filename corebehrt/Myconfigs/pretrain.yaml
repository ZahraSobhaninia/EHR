logging:
  level: INFO
  path: ./outputs/logs

paths:
## INPUTS
  prepared_data: "researcher_data:Zahra/052026/CoreBehrt_OOT/MDS/1_Pretrain/Data/"
    #researcher_data:Zahra/CoreBehrt/MDP_withoutP/1_Pretrain/Data/811
  # restart_model: ... # Use for restarting from checkpointresearcher_data:Zahra/CoreBehrt/MDP/1_Pretrain/Data/811

## OUTPUTS
  model: researcher_data:Zahra/052026/CoreBehrt_OOT/MDS/1_Pretrain/Model         # Save model/outputs to this folder
  #runs: ./outputs/pretraining # Use for generating a new model folder

data:
  dataset:
    select_ratio: 0.2
    masking_ratio: 0.8
    replace_ratio: .1
    ignore_special_tokens: true
  val_ratio: 0.1

trainer_args:

  save_representations: true
  save_labels: false
  representation_types: ["mean"]
  task: pretrain

  batch_size: 128
  effective_batch_size: 512
  epochs: 30
  info: true
  sampler: null
  gradient_clip: 
    clip_value: 1.0
  shuffle: true
  early_stopping: 8 # num_epochs or null/false



model:
  hidden_size: 384
  num_hidden_layers: 6    #  more deeper
  num_attention_heads: 6  # 384/6 = 64 
  intermediate_size: 1536 # 4x hidden_size
  type_vocab_size: 1024
  embedding_dropout: 0.1
  max_position_embeddings: 512 # the longest sequence length we will use this model with
  is_causal: false
  
optimizer:
  lr: 5e-4
  eps: 1e-6


scheduler:
  _target_: transformers.get_cosine_schedule_with_warmup              #Before:get_linear_schedule_with_warmup
  num_training_epochs: 30
  num_warmup_epochs: 4

mlm_loss:
  target_: corebehrt.modules.monitoring.metrics.LossAccessor
  loss_name: loss

metrics:
  top1:
    _target_: corebehrt.modules.monitoring.metrics.PrecisionAtK
    topk: 1
  top10:
    _target_: corebehrt.modules.monitoring.metrics.PrecisionAtK
    topk: 10
