# changes from A to A1
# consider loss weight funtion
# increase the number of batch size
# shuffle
#threshold: 0.2 --> 0,4

logging:
  level: INFO
  path: ./outputs/logs

paths:
## INPUTS
  pretrain_model: "researcher_data:Zahra/CoreBehrt_OOT/MD/1_Pretrain/Model"
  prepared_data: "researcher_data:Zahra/CoreBehrt_OOT/MD/3_Finetune/ARF/Data/FinetuneData"         
  #"researcher_data:Zahra/CoreBehrt/MDP/3_Finetune/PRI/Data/FinetuneData/811" 
  
  # restart_model: ... # Use for restarting from checkpoint
      
## OUTPUTS
  model: "researcher_data:Zahra/CoreBehrt_OOT/MD/3_Finetune/ARF/Model"    # Save model/outputs to this folder"  # Save model/outputs to this folder
  #runs: ./outputs/pretraining # Use for generating a new model folder
  
evaluate: false # evaluate best model on test sets
model:
  cls:
    _target_: ehr2vec.model.heads.ClassifierGRU
    bidirectional: true
      

trainer_args:

  sampler_function:
    _target_: corebehrt.modules.trainer.utils.Sampling.inverse_sqrt

  loss_weight_function:
    _target_: corebehrt.modules.trainer.utils.PositiveWeight.effective_n_samples
  #  _target_: corebehrt.modules.trainer.utils.PositiveWeight.sqrt


      #corebehrt.modules.trainer.utils.PositiveWeight.effective_n_samples 
    #function to calculate positive weights. Possible options: sqrt and effective_n_samples

  save_representations: true
  save_labels: true
  


  batch_size: 128 
  val_batch_size: 256 
  effective_batch_size: 512

  epochs: 20
  stopping_criterion: roc_auc   #pr_auc    #roc_auc
  early_stopping: 5

  info: true
  gradient_clip: 
    clip_value: 0.25
  shuffle: true
  checkpoint_frequency: 1
  
 
  
  # Freezing options
  n_layers_to_freeze: 2
  unfreeze_on_plateau: true       # unfreeze all layers if the performance is less than plateau_threshold 
  unfreeze_at_epoch: 2  # if unfrezze_on_plateau is true, whichever condition is met first
  plateau_threshold: 0.001
  reset_patience_after_unfreeze: true     # reset early stopping counter after unfreezing

  
optimizer:
  lr: 2e-5      #1e-5 
  eps: 1e-8
  weight_decay: 0.001 

scheduler:
  _target_: transformers.get_linear_schedule_with_warmup
  num_warmup_steps: 2000 #800
  num_training_steps: 27980  #8200      For Mortality:28260
  # num_training_steps = 1413 × 20 = 28260
  #steps_per_epoch = ceil(180823 / 128) ≈ 1413

metrics:
  accuracy:
    _target_: corebehrt.modules.monitoring.metrics.Accuracy
    threshold: 0.3
  roc_auc:
    _target_: corebehrt.modules.monitoring.metrics.ROC_AUC
  pr_auc:
    _target_: corebehrt.modules.monitoring.metrics.PR_AUC
  percentage_positives:
    _target_: corebehrt.modules.monitoring.metrics.Percentage_Positives

  mean_probability:
    _target_: corebehrt.modules.monitoring.metrics.Mean_Probability
  true_positives:
    _target_: corebehrt.modules.monitoring.metrics.True_Positives

  true_negatives:
    _target_: corebehrt.modules.monitoring.metrics.True_Negatives
  false_positives:
    _target_: corebehrt.modules.monitoring.metrics.False_Positives

  false_negatives:
    _target_: corebehrt.modules.monitoring.metrics.False_Negatives
  
  

 
