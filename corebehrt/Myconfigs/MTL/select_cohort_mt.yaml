logging:
  level: INFO
  path: ./outputs/logs

mode: multi_task

paths:
  ### Inputs
  features: 'researcher_data:Zahra/032026/CoreBehrt_OOT/MDPS/0_CreateData/features'
  initial_pids: 'researcher_data:Zahra/032026/CoreBehrt_OOT/MDPS/0_CreateData/tokenized/pids_train.pt'

  # Multi-task outcomes
  outcomes: 'researcher_data:Zahra/032026/CoreBehrt_OOT/CreateOutcome_Finetune'
  outcome_names:
    - Mortality
    - ARF
    - Bleed
  exposure: 'exposure.csv'
  outcome: 'outcome.csv'

  ### Outputs
  cohort: 'researcher_data:Zahra/032026/CoreBehrt_OOT/MDPS/MLT_MAB/2_Finetune/Data/SelectCohort'
          
selection:
  exclude_prior_outcomes: true
  exposed_only: true
  age:
    min_years: 0
    max_years: 120

index_date:
  mode: relative
  relative:
    n_hours_from_exposure: 0

cv_folds: 5
test_ratio: 0.1