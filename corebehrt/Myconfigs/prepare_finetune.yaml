logging:
  level: INFO
  path: ./outputs/logs

paths:
  ## INPUTS
  features: 'researcher_data:Zahra/022026/CoreBehrt_CV/MDP/0_CreateData/features' #./outputs/features
  tokenized: 'researcher_data:Zahra/022026/CoreBehrt_CV/MDP/0_CreateData/tokenized' # ./outputs/tokenized
  cohort: "researcher_data:Zahra/022026/CoreBehrt_CV/MDP/2_Finetune/PRI/Data/SelectCohort"   #./outputs/cohort/finetune/ # path to cohort directory
  outcomes: 'researcher_data:Zahra/022026/CoreBehrt_CV/CreateOutcome/PRI' #./outputs/outcomes
  outcome: 'outcome.csv'
  ## OUTPUTS
  prepared_data: "researcher_data:Zahra/022026/CoreBehrt_CV/MDP/2_Finetune/PRI/Data/Processed_data"  # ./outputs/finetuning/processed_data/ # Save model/outputs to this folder
  #runs: ./outputs/pretraining # Use for generating a new model folder


data:
  type: "finetune"
  truncation_len: 512
  min_len: 2 # 0 by default

outcome:
  # we will convert outcomes to binary based on whether at least one outcome is in the follow up window
  n_hours_censoring: 0 # censor time after index date (negative means before)
  n_hours_start_follow_up: 0 # start follow up (considering outcomes) time after index date (negative means before)
  n_hours_end_follow_up: 720 # end follow up (considering outcomes) time after index date (negative means before)

