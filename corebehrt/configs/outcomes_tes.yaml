logging:
  level: INFO
  path: ./outputs/logs

paths:
  data: ./tests/data/raw
  features: ./outputs/data/features
  outcomes: ./outputs/outcomes

loader:
  concepts: [
    diagnose
  ]
  batchsize: 10_000
  chunksize: 10_000

outcomes:
  TEST_OUTCOME: 
    type: [CONCEPT]
    match: [['157', '169']]
    exclude: ['157141000119108']
    match_how: contains
    case_sensitive: true
  TEST_CENSOR:
    type: [CONCEPT]
    match: [['169']]
    match_how: startswith
    case_sensitive: false
    
